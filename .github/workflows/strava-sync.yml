name: Sync Strava Activities

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch Strava Data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          node -e '
          const fs = require("fs");
          async function sync() {
            const tokenRes = await fetch("https://www.strava.com/oauth/token", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                client_id: process.env.STRAVA_CLIENT_ID,
                client_secret: process.env.STRAVA_CLIENT_SECRET,
                refresh_token: process.env.STRAVA_REFRESH_TOKEN,
                grant_type: "refresh_token"
              })
            });
            const tokenData = await tokenRes.json();
            
            if (!tokenData.access_token) {
              console.error("Failed to refresh access token:", tokenData);
              process.exit(1);
            }
            
            const accessToken = tokenData.access_token;

            const actRes = await fetch("https://www.strava.com/api/v3/athlete/activities?per_page=200", {
              headers: { Authorization: `Bearer ${accessToken}` }
            });
            const activities = await actRes.json();

            // Safety check: ensure response is an array before filtering
            if (!Array.isArray(activities)) {
              console.error("Strava API did not return an array of activities:", activities);
              process.exit(1);
            }

            // 3. Filter both Runs and Walks (checking both type & sport_type)
            const allowedTypes = ["Run", "Walk"];
            const filteredActivities = activities
              .filter(a => allowedTypes.includes(a.type) || allowedTypes.includes(a.sport_type))
              .map(a => ({
                date: a.start_date_local.split("T")[0],
                distanceKm: Number((a.distance / 1000).toFixed(2)),
                type: a.type || a.sport_type // Distinguish between Run and Walk if needed
              }));

            fs.writeFileSync("./src/data/strava-activities.json", JSON.stringify(filteredActivities, null, 2));
            console.log(`Synced ${filteredActivities.length} activities (Runs & Walks) successfully!`);
          }
          sync();
          '

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/strava-activities.json
          git commit -m "update: sync strava running & walking activities" || exit 0
          git push